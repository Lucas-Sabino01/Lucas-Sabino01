<svg xmlns="http://www.w3.org/2000/svg" width="850" height="720">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height: 100%; width: 100%;">
      <style>
        :root {
            --bg-base: #09090b;
            --card-bg: rgba(24, 24, 27, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-blue: #0ea5e9;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --glow-purple: rgba(168, 85, 247, 0.15);
            --glow-blue: rgba(14, 165, 233, 0.12);
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .bento-wrapper {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 100% 0%, var(--glow-purple), transparent 50%),
                radial-gradient(circle at 0% 100%, var(--glow-blue), transparent 50%);
            width: 850px;
            height: 720px;
            padding: 24px;
            box-sizing: border-box;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto 140px 180px;
            gap: 16px;
            flex-grow: 1;
        }

        .bento-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .bento-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        }

        .card-span-2 {
            grid-column: span 2;
        }

        .card-center {
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1f1f22 0%, var(--card-bg) 100%);
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent-purple);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 16px;
            width: max-content;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .ai-text {
            font-size: 17px;
            line-height: 1.6;
            color: var(--text-main);
            margin: 0;
            font-weight: 400;
        }

        .pulse-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
        }

        .pulse-dot {
            width: 16px;
            height: 16px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-green);
        }

        .status-title { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        .status-user { font-size: 14px; color: var(--text-muted); font-family: monospace; }
        
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: auto;
        }

        .stat-icon svg { width: 20px; height: 20px; }

        .stat-info { margin-top: 16px; }
        .stat-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--text-main); }

        .lang-item { margin-bottom: 14px; }
        .lang-item:last-child { margin-bottom: 0; }
        .lang-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text-main); font-weight: 500; }
        .progress-track { height: 8px; background: rgba(255,255,255,0.05); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 999px; }
        
        .stats-grid-small { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
        .mini-stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; font-weight: 600; letter-spacing: 0.5px; }
        .mini-stat-value { font-size: 20px; font-weight: 700; color: var(--text-main); }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
        }
        
        .footer-tag {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
        }

      </style>
      
      <div class="bento-wrapper">
        <div class="bento-grid">
            
            <div class="bento-card card-span-2" style="justify-content: center;">
                <div class="ai-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                    Gemini AI Report
                </div>
                <p class="ai-text">Com 327 contribuições e o talento em Java, o Lucas deve estar em modo estratégico, rascunhando arquiteturas que farão seus 5 PRs parecerem poucos. Ou quem sabe, apenas recarregando as baterias com um bom café ☕, preparando-se para o próximo projeto de 1 estrela ✨.</p>
            </div>

            <div class="bento-card card-center">
                <div class="pulse-ring">
                    <div class="pulse-dot"></div>
                </div>
                <div class="status-title">System Active</div>
                <div class="status-user">@Lucas-Sabino01</div>
            </div>

            <div class="bento-card">
                <div class="stat-icon" style="color: var(--accent-green);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" y1="9" x2="6" y2="21"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Commits (24h)</div>
                    <div class="stat-value">0</div>
                </div>
            </div>

            <div class="bento-card">
                <div class="stat-icon" style="color: var(--accent-blue);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Foco Principal</div>
                    <div class="stat-value" style="font-size: 20px;">Planejamento e Café ☕</div>
                </div>
            </div>

            <div class="bento-card">
                <div class="stat-icon" style="color: var(--accent-yellow);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </div>
                <div class="stat-info">
                    <div class="stat-label">Nível de Energia</div>
                    <div class="stat-value" style="font-size: 20px;">Recarregando 🔋</div>
                </div>
            </div>

            <div class="bento-card card-span-2">
                <div class="stat-label" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-purple)"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
                    Linguagens Mais Usadas
                </div>
                
                <div class="lang-item">
                    <div class="lang-header">
                        <span>TypeScript</span> <span style="color: var(--text-muted)">87%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: 87%; background: var(--accent-blue);"></div>
                    </div>
                </div>

                <div class="lang-item">
                    <div class="lang-header">
                        <span>Kotlin</span> <span style="color: var(--text-muted)">7%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: 7%; background: var(--accent-purple);"></div>
                    </div>
                </div>

                <div class="lang-item">
                    <div class="lang-header">
                        <span>Java</span> <span style="color: var(--text-muted)">2%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: 2%; background: var(--accent-yellow);"></div>
                    </div>
                </div>
            </div>

            <div class="bento-card">
                <div class="stat-label" style="margin-bottom: 8px;">Métricas Globais</div>
                <div class="stats-grid-small">
                    <div>
                        <div class="mini-stat-label">
                            <span style="color: var(--accent-yellow)">★</span> Stars
                        </div>
                        <div class="mini-stat-value">1</div>
                    </div>
                    <div>
                        <div class="mini-stat-label">
                            <span style="color: var(--accent-green)">●</span> Issues
                        </div>
                        <div class="mini-stat-value">0</div>
                    </div>
                    <div>
                        <div class="mini-stat-label">
                            <span style="color: var(--accent-purple)">⑂</span> PRs
                        </div>
                        <div class="mini-stat-value">5</div>
                    </div>
                    <div>
                        <div class="mini-stat-label">
                            <span style="color: var(--accent-blue)">⚡</span> Contribs
                        </div>
                        <div class="mini-stat-value">327</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="footer">
            <div style="text-align: left;">🚀 Painel dinâmico atualizado via <strong>GitHub Actions</strong> • A IA do <strong>Gemini 2.5</strong> analisa meus commits diários e gera os insights.</div>
            <div class="footer-tag">Sincronizado: 11 de ago. de 2026</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>